name: Build Gesture AI Controller

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build APK
  run: gradle --stacktrace --info assembleDebug

      - name: Build APK
        run: gradle --stacktrace assembleDebug

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: GestureAI-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7